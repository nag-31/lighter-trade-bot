# =============================================================================
# SETTINGS -- tweak these without touching any Python code
# Restart the bot after any change: sudo systemctl restart lighterbot
# =============================================================================

settings:

  # -- Position size filter -------------------------------------------------
  # Minimum position notional (USD) to fire a Telegram alert.
  # Per-source overrides in the sources list below take priority.
  # Set to 0 to alert on every fill regardless of size.
  # NOTE: for batched add/reduce alerts this threshold is applied to the
  # AGGREGATED fill notional after the window closes (i.e. an alert fires only
  # if the net added/reduced across the window is >= this amount), not to the
  # standing position size — so small scale-tweaks no longer spam.
  default_min_notional_usd: 1000

  # -- Alert types ----------------------------------------------------------
  # Toggle which events send a Telegram message.
  # The dashboard always shows all events regardless of these flags.
  alert_on_open: true          # new position opened
  alert_on_close: true         # position fully closed  (always fires)
  alert_on_size_change: true   # same-side adds to an existing position (batched)
  alert_on_reduce: true        # partial closes / reduce-only fills (batched)

  # -- Batching window ------------------------------------------------------
  # SIZE_CHANGE and REDUCE fills that arrive within this window are merged into
  # a single alert showing total notional + fill count.
  # Lower = more real-time but noisier. Higher = cleaner but delayed.
  aggregate_window_seconds: 60

  # -- Cross-coin session digest ---------------------------------------------
  # Add/reduce alerts that flush within this window (per source) are combined
  # into ONE Telegram message instead of one per coin. 0 = off (immediate).
  digest_window_seconds: 20

  # -- Daily jobs (UTC midnight) ----------------------------------------------
  # daily_recap_enabled    : post a recap of the day's closed trades to the channel.
  # daily_self_audit_enabled: privately DM TELEGRAM_OWNER_USER_ID if the DB's
  #                           per-coin PnL disagrees with the exchange (>$1).
  daily_recap_enabled: true
  daily_self_audit_enabled: true

  # -- Timing ---------------------------------------------------------------
  # How often the REST safety-net polls for any fills the WebSocket missed.
  rest_poll_seconds: 60

  # How often positions are re-synced from the exchange API to catch silent closes.
  reconciler_interval_seconds: 30
  stale_position_warning_seconds: 120
  stale_position_down_seconds: 600

  # -- Duplicate suppression ------------------------------------------------
  # Identical Telegram messages within this window are silently dropped.
  # Protects against double-alerts when two bot instances briefly overlap.
  tg_dedup_window_seconds: 90

  # -- Dashboard ------------------------------------------------------------
  dashboard_port: 8080
  max_recent_events: 200       # rows visible in the browser event table
  max_closed_trades: 200       # closed trades shown in the UI history grid
  stats_full_history: true     # analytics computed over ALL closed trades, not just last-N
  open_orders_enabled: true    # show the resting/open-orders dashboard panel
  execution_chart_enabled: false  # keep PnL cards; disable entry/exit PNG attachments

  # -- Stats display window -------------------------------------------------
  # Scope which closed trades the dashboard shows WITHOUT importing full history.
  # Dates are ISO ("2026-05-01" or "2026-05-01T00:00:00Z").
  #   stats_start_date : only trades on/after this date are shown (null = no start).
  #   stats_end_date   : null = up to now (current date/time). Date-only = end of day.
  #   stats_symbols    : whitelist of tickers. Empty/omitted = every coin in the DB
  #                      (today that's only the coins already on the dashboard,
  #                      since no full-history import was done). Fill this list to
  #                      lock the view to specific coins after any future import.
  stats_start_date: "2026-06-01"   # last 4 days (today is 2026-06-04)
  stats_end_date: null             # null = up to now
  stats_symbols: []                # empty = all coins currently in the DB

  # -- Privacy (Hyperliquid display obfuscation) ----------------------------
  # Stops followers from fingerprinting your public on-chain wallet via the
  # alerts. Posture: "exact results, fuzzy fingerprint" -- PnL $, %, win-rate
  # and win/loss stay EXACT and honest; only price/size/notional/timestamps
  # are fuzzed. HL-only -- Lighter is never touched.
  # Flip privacy_enabled to false to instantly show 100% real values again.
  # NOTE: the secret salt is NOT here -- set PRIVACY_SECRET_KEY in .env.
  privacy_enabled: true
  privacy_mag: 0.003               # price jitter +-0.3% (must be 0 < mag < 0.05)
  privacy_entry_quantum_pct: 0.005 # coarse seed bucket (0.5% of price)
  privacy_size_sigfigs: 2          # round displayed size to N significant figures
  privacy_notional_sigfigs: 2      # round displayed notional to N significant figures
  privacy_time_bucket: relative    # exact | hour | relative
  privacy_disclose_footnote: false # append "prices approx * PnL exact" to HL alerts/cards (off = hidden)

  # -- Binance proxy pool ---------------------------------------------------
  # Rotating proxy list used to bypass Binance HTTP 451 geo-blocks from this
  # Azure region.  The bot tries each proxy in round-robin order, marks failing
  # ones dead for 5 minutes, and degrades gracefully when all are dead (Binance
  # source goes DOWN in /health; HL/Lighter keep running unaffected).
  #
  # IMPORTANT: free public proxies die fast -- refresh this list regularly.
  # US-based proxies will NOT bypass the Binance.com US geo-block; use
  # Singapore/EU/non-US proxies.  A paid SOCKS5 service is far more reliable.
  #
  # Used ONLY for reading positions/trades -- the bot never places orders.
  # The Binance source below (sources section) must be uncommented to use them.
  binance_proxy_test_url: "https://fapi.binance.com/fapi/v1/ping"
  binance_proxies:
    - socks5://144.31.222.205:1080
    - socks4://45.89.111.139:1081
    - socks4://171.248.219.6:1080
    - socks4://67.201.39.14:4145
    - socks4://68.71.247.130:4145
    - socks4://68.183.52.128:9116
    - socks4://184.182.240.211:4145
    - http://65.108.203.35:18080
    - socks4://192.111.137.37:18762
    - socks4://72.49.49.11:31034
    - socks4://194.58.37.234:65200
    - socks4://116.100.218.33:1080
    - socks4://117.175.168.195:1080
    - http://195.138.235.230:8080


# =============================================================================
# SOURCES -- one entry per tracked pool / wallet / account
# =============================================================================
#
# Supported types:
#   lighter     -> either pool_id (public pool) or address_env (wallet account)
#   hyperliquid -> wallet address loaded from the configured address_env
#   binance     -> credentials loaded from api_key_env + api_secret_env
#                  (both one-way and hedge mode are supported)
#                  Geo-block bypass: set binance_proxies in settings above.
#
# All source types share:
#   id                -- stable, unique machine id; never rename after deployment
#   name              -- label shown on dashboard and in Telegram alerts
#   min_notional_usd  -- per-source override (default: settings.default_min_notional_usd)
#   footer_url        -- optional public URL appended to alerts (HL/Binance only)
#
# Security rules (enforced in code):
#   - Lighter wallet     -> .env only (LIGHTER_ADDRESS);               never here
#   - HL wallet address  -> .env only (HL_ADDRESS);                    never here
#   - Binance API creds  -> .env only (BINANCE_API_KEY / _SECRET);     never here
#   - Lighter pool URL   -> safe to show (it's a public URL)
#   - footer_url         -> only put a public website here, NOT an account URL

sources:
  - type: lighter
    id: lighter-wallet
    name: "Lighter Wallet"
    address_env: LIGHTER_ADDRESS
    account_slot: 0

  - type: hyperliquid
    id: hl-main
    name: "HL Swing Wallet"
    address_env: HL_ADDRESS
    min_notional_usd: 1000
    exclude_symbols: ["FARTCOIN"]
    footer_url: "https://enkapital.xyz"

  - type: hyperliquid
    id: hl-second
    name: "HL 2"
    address_env: HL_ADDRESS_2
    min_notional_usd: 1000
    footer_url: "https://enkapital.xyz"

  # Binance disabled -- source is HTTP 451 geo-blocked from the current region.
  # Re-enable (uncomment) once binance_proxies above are configured and working.
  # Credentials go in .env: BINANCE_API_KEY + BINANCE_API_SECRET (read-only).
  # - type: binance
  #   id: binance-main
  #   name: "Binance"
  #   min_notional_usd: 900
  #   api_key_env: BINANCE_API_KEY
  #   api_secret_env: BINANCE_API_SECRET
  #
  # Add more accounts by repeating an entry with a new stable id and different
  # env-variable references. Missing credentials disable only that account.
  # - type: hyperliquid
  #   id: hl-second
  #   name: "HL 2"
  #   address_env: HL_ADDRESS_2
  #
  # - type: lighter
  #   id: lighter-second
  #   name: "Lighter Pool 2"
  #   pool_id: 123456789
  #
  # - type: lighter
  #   id: lighter-wallet-2
  #   name: "Lighter Wallet 2"
  #   address_env: LIGHTER_ADDRESS_2
  #   account_slot: 0
  #
  # If one wallet has Lighter subaccounts, repeat the wallet entry with the
  # same address_env, a unique id, and account_slot: 1, 2, etc.
  #
  # - type: binance
  #   id: binance-second
  #   name: "Binance 2"
  #   api_key_env: BINANCE_API_KEY_2
  #   api_secret_env: BINANCE_API_SECRET_2
