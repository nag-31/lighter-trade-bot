<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Private Portfolio</title>
  <link rel="stylesheet" href="/static/style.css?v=20260718-2" />
  <link rel="stylesheet" href="/static/login.css?v=20260718-2" />
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Portfolio</span>
      </div>
      <div class="login-lock" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24"><rect x="5" y="10" width="14" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <h1 id="login-title">Private portfolio</h1>
      <p>Your wallets and saved history are available after sign in.</p>
      <form id="login-form" novalidate>
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" title="Show password">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
        </div>
        <div class="login-error" id="login-error" role="alert" aria-live="polite"></div>
        <button class="btn btn-accent login-submit" id="login-submit" type="submit">Sign in</button>
      </form>
    </section>
  </main>
  <script src="/static/login.js?v=20260718-2"></script>
</body>
</html>
